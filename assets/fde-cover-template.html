<!doctype html>
<!--
  FDE 入场包 · 封面卡模板（司马迁 · 输出三）
  用法：只替换 {{双花括号}} 槽位，不改布局、配色、字体。
  槽位：{{NAME}} 姓名 · {{SCOPE}} 覆盖范围一句 · {{N_SESSIONS}} 会话数 ·
       {{N_WORKFLOWS}} 工作流数 · {{N_READY}} 可独立接管数 ·
       {{VERDICT}} 太史公式判词一句 · {{DATE}} 日期 · {{MODE}} 轻量版/全量版
  导出 PNG：有浏览器环境时按 1080x1440 截图；纯聊天环境交本文件即可。
-->
<html lang="zh"><head><meta charset="utf-8"><title>{{NAME}} · FDE 入场包</title>
<style>
  :root{--paper:#F5EFE2;--ink:#26231E;--muted:#8A8272;--seal:#9E2B25;--line:rgba(38,35,30,.16)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#3a372f;display:flex;justify-content:center;padding:24px 0;
       font-family:"Songti SC","Noto Serif SC","Source Han Serif SC",serif;color:var(--ink)}
  .card{width:1080px;height:1440px;background:
        radial-gradient(1200px 800px at 20% 0%,rgba(255,255,255,.5),transparent 60%),
        radial-gradient(900px 700px at 100% 100%,rgba(158,43,37,.045),transparent 55%),
        var(--paper);
        position:relative;display:flex;flex-direction:column;padding:88px 92px 72px;overflow:hidden}
  .card::before{content:"";position:absolute;inset:26px;border:1px solid var(--line);pointer-events:none}
  .wm{position:absolute;right:-28px;top:170px;font-weight:900;font-size:560px;line-height:.85;
      color:rgba(38,35,30,.045);writing-mode:vertical-rl;letter-spacing:-.08em;user-select:none}
  .eyebrow{display:flex;justify-content:space-between;align-items:center;
           font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:19px;letter-spacing:.34em;
           text-transform:uppercase;color:var(--muted)}
  .eyebrow b{color:var(--ink);font-weight:600}
  .head{margin-top:150px;position:relative;z-index:1}
  .kicker{font-size:26px;letter-spacing:.5em;color:var(--seal);margin-bottom:26px}
  h1{font-size:118px;line-height:1.08;font-weight:900;letter-spacing:.01em}
  h1 small{display:block;font-size:44px;font-weight:600;color:var(--muted);margin-top:18px;letter-spacing:.14em}
  .scope{margin-top:44px;font-size:30px;line-height:1.7;color:#4c463c;max-width:24em}
  .seal{position:absolute;top:196px;right:92px;width:150px;height:150px;background:var(--seal);
        color:#F5EFE2;display:flex;align-items:center;justify-content:center;font-size:86px;font-weight:900;
        box-shadow:0 2px 0 rgba(0,0,0,.08);transform:rotate(3deg)}
  .seal::after{content:"";position:absolute;inset:9px;border:2px solid rgba(245,239,226,.55)}
  .stats{margin-top:auto;display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stat{flex:1;padding:40px 8px 36px;text-align:center}
  .stat+.stat{border-left:1px solid var(--line)}
  .stat b{display:block;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:76px;font-weight:700;letter-spacing:-.02em}
  .stat span{display:block;margin-top:14px;font-size:22px;letter-spacing:.3em;color:var(--muted)}
  .verdict{margin:58px 0 0;padding-left:34px;border-left:5px solid var(--seal);
           font-size:36px;line-height:1.75;font-weight:600}
  .verdict i{font-style:normal;display:block;margin-top:16px;font-size:22px;letter-spacing:.28em;color:var(--muted)}
  .foot{margin-top:64px;display:flex;justify-content:space-between;align-items:baseline;
        font-family:"JetBrains Mono",ui-monospace,monospace;font-size:20px;letter-spacing:.22em;color:var(--muted)}
  .foot .mode{color:var(--seal);font-weight:700}
</style></head><body>
<div class="card">
  <div class="wm">接管</div>
  <div class="eyebrow"><span><b>FDE PACK</b>&nbsp;&nbsp;交接包</span><span>司馬遷 · 輸出三</span></div>
  <div class="seal">接</div>
  <div class="head">
    <div class="kicker">让 AI 接管你的工作现场</div>
    <h1>{{NAME}}<small>FDE 入场包 · Handover Pack</small></h1>
    <p class="scope">{{SCOPE}}</p>
  </div>
  <div class="stats">
    <div class="stat"><b>{{N_SESSIONS}}</b><span>会话分析</span></div>
    <div class="stat"><b>{{N_WORKFLOWS}}</b><span>高频工作流</span></div>
    <div class="stat"><b>{{N_READY}}</b><span>✅ 可独立接管</span></div>
  </div>
  <div class="verdict">{{VERDICT}}<i>太史公曰</i></div>
  <div class="foot"><span>{{DATE}} · <span class="mode">{{MODE}}</span></span><span>simaqian.caojuege.com</span></div>
</div>
</body></html>
