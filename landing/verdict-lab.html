<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>太史判词实验室 · 司马迁.skill</title>
  <meta name="robots" content="noindex" />
  <style>
    :root{
      --paper:#f4efe4;
      --paper-deep:#ebe2d2;
      --ink:#191919;
      --muted:rgba(25,25,25,.58);
      --hair:rgba(25,25,25,.16);
      --red:#aa302c;
      --red-dark:#76201d;
      --black:#171717;
      --soft:#fffaf0;
      --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSongti","STSong","SimSun",serif;
      --sans:"Inter","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    }
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif)}
    body{min-height:100vh}
    button,input,textarea{font:inherit}
    .page{width:min(1180px,calc(100vw - 32px));margin:0 auto;padding:34px 0 56px}
    .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:26px}
    .eyebrow{font-family:var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-size:13px;margin-bottom:12px}
    h1{font-size:clamp(38px,6vw,76px);line-height:.98;margin:0;font-weight:700;letter-spacing:-.04em}
    .sub{margin:16px 0 0;color:var(--muted);font-size:18px;line-height:1.8;max-width:720px}
    .badge{border:1px solid rgba(25,25,25,.35);padding:10px 14px;font-size:14px;color:rgba(25,25,25,.66);white-space:nowrap;background:rgba(255,255,255,.28)}
    .grid{display:grid;grid-template-columns:minmax(300px,390px) 1fr;gap:28px;align-items:start}
    .panel{border:1px solid var(--hair);background:rgba(255,255,255,.34);box-shadow:0 18px 44px rgba(50,35,16,.06)}
    .panel-head{padding:18px 20px;border-bottom:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;gap:12px}
    .panel-title{font-size:22px;font-weight:700;letter-spacing:.02em}
    .panel-note{font-family:var(--sans);font-size:12px;color:var(--muted)}
    .panel-body{padding:20px}
    .source-card-wrap{display:flex;justify-content:center;background:rgba(255,255,255,.18);padding:12px}
    #sourceCard{width:100%;max-width:318px;height:auto;display:block;box-shadow:0 14px 34px rgba(0,0,0,.08)}
    .form{display:grid;gap:16px}
    label{display:block}
    .label-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:7px}
    .label{font-size:15px;color:rgba(25,25,25,.72)}
    .hint{font-family:var(--sans);font-size:12px;color:rgba(25,25,25,.42)}
    input,textarea{width:100%;border:0;border-bottom:1px solid rgba(25,25,25,.28);background:rgba(255,255,255,.42);padding:13px 12px;color:var(--ink);outline:none;line-height:1.7;border-radius:0}
    textarea{min-height:96px;resize:vertical}
    input:focus,textarea:focus{border-bottom-color:var(--red);background:rgba(255,255,255,.68)}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
    .btn{border:1px solid rgba(25,25,25,.28);background:transparent;color:var(--ink);padding:12px 17px;cursor:pointer;transition:.16s ease;font-family:var(--sans);font-size:14px}
    .btn:hover{transform:translateY(-1px);background:rgba(255,255,255,.46)}
    .btn.primary{background:var(--black);color:#f5efe3;border-color:var(--black)}
    .btn.red{background:var(--red);color:#f4e9d5;border-color:var(--red-dark)}
    .btn:active{transform:translateY(0)}
    .result-grid{display:grid;grid-template-columns:minmax(280px,420px) minmax(280px,420px);gap:22px;align-items:start}
    .canvas-shell{background:rgba(255,255,255,.22);padding:12px;display:flex;justify-content:center;min-height:380px;align-items:center}
    canvas{max-width:100%;height:auto;display:block}
    #verdictCard{box-shadow:0 18px 38px rgba(47,30,9,.10)}
    #wildCard{width:100%;max-width:360px;box-shadow:0 18px 38px rgba(47,30,9,.10)}
    .compare-label{font-family:var(--sans);font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.7}
    .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;background:#191919;color:#f4efe4;padding:10px 14px;font-family:var(--sans);font-size:13px;transition:.18s ease;z-index:20}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .mini-flow{display:flex;gap:8px;flex-wrap:wrap;margin:26px 0 22px;color:rgba(25,25,25,.52);font-family:var(--sans);font-size:13px}
    .mini-flow span{border:1px solid rgba(25,25,25,.18);padding:7px 10px;background:rgba(255,255,255,.22)}
    .mobile-tip{display:none;color:var(--muted);font-family:var(--sans);font-size:13px;line-height:1.7;margin-top:12px}
    @media (max-width: 900px){
      .topbar{display:block}.badge{display:inline-block;margin-top:18px}.grid,.result-grid{grid-template-columns:1fr}.page{width:min(100vw - 22px,720px);padding-top:22px}.panel-body{padding:16px}h1{font-size:48px}.sub{font-size:16px}.mobile-tip{display:block}
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div>
        <div class="eyebrow">SIMAQIAN.SKILL · VERDICT LAB</div>
        <h1>太史判词实验室</h1>
        <p class="sub">这是一个隔离测试页：不接大模型、不改正式提示词，只验证“损友补刀 → 一张可转发判词卡”的社交效果。</p>
      </div>
      <div class="badge">本地实验页 · 不影响正式站</div>
    </header>

    <div class="mini-flow" aria-label="flow">
      <span>原列传</span><span>损友补刀</span><span>太史判词</span><span>野史长卡对照</span>
    </div>

    <section class="grid">
      <aside class="panel">
        <div class="panel-head">
          <div class="panel-title">原列传</div>
          <div class="panel-note">复用现有卡片渲染</div>
        </div>
        <div class="panel-body">
          <div class="source-card-wrap"><canvas id="sourceCard"></canvas></div>
          <p class="mobile-tip">手机上建议先看“太史判词”这张小卡，长卡只做对照。</p>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div class="panel-title">损友补刀</div>
          <div class="panel-note">纯前端模板拼接</div>
        </div>
        <div class="panel-body">
          <form class="form" id="friendForm">
            <label>
              <div class="label-row"><span class="label">TA 的称呼</span><span class="hint">朋友愿意被这样叫</span></div>
              <input id="name" value="韶华" autocomplete="off" />
            </label>
            <label>
              <div class="label-row"><span class="label">TA 最让你受不了的口头禅</span><span class="hint">越具体越好</span></div>
              <input id="bad1" value="等我三分钟（其实是半小时起）" autocomplete="off" />
            </label>
            <label>
              <div class="label-row"><span class="label">最近一次见面，TA 做了什么很 TA 的事</span><span class="hint">名场面</span></div>
              <textarea id="bad2">TA 直接退出上一个创业项目了，说要自己干</textarea>
            </label>
            <label>
              <div class="label-row"><span class="label">TA 最可爱的隐藏 bug / 反差</span><span class="hint">当面也能说的那种</span></div>
              <textarea id="bad3">想法太多，Idea 满天飞，三天想换一个新产品做</textarea>
            </label>
            <div class="actions">
              <button class="btn primary" type="submit">生成太史判词</button>
              <button class="btn" type="button" id="copyLinkBtn">复制测试链接</button>
            </div>
          </form>
        </div>
      </section>
    </section>

    <section class="panel" style="margin-top:28px">
      <div class="panel-head">
        <div class="panel-title">生成结果</div>
        <div class="panel-note">先验证短卡是否有传播冲动</div>
      </div>
      <div class="panel-body">
        <div class="result-grid">
          <div>
            <div class="canvas-shell"><canvas id="verdictCard" width="1080" height="1080"></canvas></div>
            <p class="compare-label">主传播物：一张“太史判词”小卡。目标是被单独截图、保存、甩回群里。</p>
            <div class="actions"><button class="btn red" type="button" id="downloadVerdictBtn">下载判词卡</button></div>
          </div>
          <div>
            <div class="canvas-shell"><canvas id="wildCard"></canvas></div>
            <p class="compare-label">对照物：野史毒传长卡。用于判断“长文毒传”是否反而降低转发率。</p>
            <div class="actions"><button class="btn" type="button" id="downloadWildBtn">下载野史长卡</button></div>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div class="toast" id="toast">已复制</div>

  <script src="./card.js"></script>
  <script>
  (function(){
    'use strict';

    const $ = (id) => document.getElementById(id);
    const els = {
      form: $('friendForm'), name: $('name'), bad1: $('bad1'), bad2: $('bad2'), bad3: $('bad3'),
      sourceCard: $('sourceCard'), verdictCard: $('verdictCard'), wildCard: $('wildCard'), toast: $('toast'),
      copyLinkBtn: $('copyLinkBtn'), downloadVerdictBtn: $('downloadVerdictBtn'), downloadWildBtn: $('downloadWildBtn')
    };

    const sourceData = {
      style: 'roast', label: '毒撰版', title: '韶华列传', seal: '司馬毒撰',
      chip1: '反技术主义者', chip2: '社群收藏家', chip3: '截稿焦虑症',
      quote: '反风口，却最怕错过',
      p1: '韶华者，自称反技术主义，却日日 vibe coding，赶发布节点写稿，盯 GPT 与 DeepSeek 动向如盯股票行情。',
      p2: '口称宋人审美与慢生活，实则最怕错过；草诀歌创始成员六十余，两周一聚，线上匪帮；七年翻译行业，说是转型，其实是出走。',
      taishi: '一个反风口的人，把自己活成了风口最敏锐的观测站。',
      volume: '199', volumeLabel: '毒撰'
    };

    function getInitialParams(){
      const merged = new URLSearchParams(window.location.search || '');
      const hash = window.location.hash || '';
      const qIndex = hash.indexOf('?');
      if(qIndex >= 0){
        const hp = new URLSearchParams(hash.slice(qIndex + 1));
        hp.forEach((v,k)=>merged.set(k,v));
      }
      ['role','name'].forEach(k => { if(merged.get(k)) merged.set('name', merged.get(k)); });
      return merged;
    }

    function readState(){
      return {
        name: clean(els.name.value) || '某某',
        bad1: clean(els.bad1.value) || '等我三分钟',
        bad2: clean(els.bad2.value) || '突然说要自己干',
        bad3: clean(els.bad3.value) || '想法太多，三天一新坑'
      };
    }

    function clean(s){ return String(s || '').replace(/\s+/g, ' ').trim(); }

    function stableNumber(seed){
      let h = 2166136261;
      for(const ch of seed){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      return String(Math.abs(h) % 999 + 1).padStart(3, '0');
    }

    function pick(arr, seed){
      let h = 0;
      for(const ch of seed) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
      return arr[h % arr.length];
    }

    function buildVerdict(s){
      const n = s.name;
      const b1 = s.bad1.replace(/[。.!！]+$/,'');
      const b1Short = b1.replace(/[（(].*$/,'').trim() || b1;
      const b2 = s.bad2.replace(/[。.!！]+$/,'');
      const b3 = s.bad3.replace(/[。.!！]+$/,'');
      const patterns = [
        `项目退得果断，Idea 换得更果断；只有那句“${b1Short}”，从未准时过。`,
        `他说“${b1Short}”时，时间已经自动融资半小时。`,
        `${n}不是没有方向，只是每个新 Idea 都像在向他招手。`,
        `能从旧项目里抽身，却很难从下一个 Idea 里脱身。`,
        `此人最大的自律，是三天换一个新坑还觉得自己在聚焦。`
      ];
      let sentence = pick(patterns, n + b1 + b2 + b3);
      // 对当前样例强制选最像用户给定事实的一句，便于第一次评估。
      if(n.includes('韶华')) sentence = patterns[0];
      return {
        volume: stableNumber(n + b1 + b2 + b3),
        sentence,
        evidence: `损友供词：${shorten(b1, 14)}；${shorten(b2, 16)}；${shorten(b3, 16)}`,
        title: `${n}毒撰`
      };
    }

    function buildWildCardData(s){
      const n = s.name;
      return {
        style: 'roast', title: `${n}毒撰`, chip1: '时间折叠术', chip2: '单干冲动', chip3: 'Idea 多动症',
        quote: '且慢，容他再想个新 Idea', volume: stableNumber(n + s.bad1 + s.bad2 + s.bad3), volumeLabel: '毒撰',
        p1: `${n}者，世人或称其深沉。然死党私勘其状，称其每与人期，必曰“${s.bad1}”。闻者皆知其缓兵之计，唯其自以为神鬼不觉。`,
        p2: `近又有名场面：${s.bad2}。其隐藏 bug 在于：${s.bad3}。此疾不在腠理，而在心海；心如脱缰野马，脑如爆裂 Token。`,
        taishi: buildVerdict(s).sentence
      };
    }

    function shorten(text, limit){
      const arr = Array.from(String(text || ''));
      return arr.length > limit ? arr.slice(0, limit - 1).join('') + '…' : arr.join('');
    }

    function wrapCanvasText(ctx, text, maxWidth, maxLines){
      const tokens = String(text || '').match(/[A-Za-z0-9_./:+#%\-]+|\s+|./gu) || [];
      const lines = [];
      let line = '';
      const push = () => { if(line.trim()) lines.push(line.trim()); line = ''; };
      for(const tok of tokens){
        const candidate = line + tok;
        if(ctx.measureText(candidate).width <= maxWidth){ line = candidate; continue; }
        if(line) push();
        if(!/^\s+$/.test(tok)) line = tok;
        if(maxLines && lines.length >= maxLines) break;
      }
      if(line && (!maxLines || lines.length < maxLines)) push();
      if(maxLines && lines.length === maxLines){
        let last = lines[maxLines - 1];
        while(last && ctx.measureText(last + '…').width > maxWidth) last = last.slice(0, -1);
        if(last && tokens.join('').trim() !== lines.join('').trim()) lines[maxLines - 1] = last + '…';
      }
      return lines;
    }

    function drawSeal(ctx, x, y, size){
      ctx.save();
      ctx.fillStyle = '#aa302c';
      ctx.fillRect(x, y, size, size);
      ctx.strokeStyle = '#76201d';
      ctx.lineWidth = 5;
      ctx.strokeRect(x + 2, y + 2, size - 4, size - 4);
      ctx.strokeStyle = 'rgba(240,223,196,.62)';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 12, y + 12, size - 24, size - 24);
      ctx.fillStyle = '#f0dfc4';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `700 ${Math.round(size * .29)}px "Songti SC", STSong, serif`;
      ctx.fillText('司馬', x + size/2, y + size*.33);
      ctx.fillText('毒判', x + size/2, y + size*.70);
      ctx.restore();
    }

    function drawVerdictCard(s){
      const verdict = buildVerdict(s);
      const canvas = els.verdictCard;
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#f1eadc';
      ctx.fillRect(0,0,W,H);

      ctx.save();
      ctx.fillStyle = 'rgba(132,104,61,.10)';
      ctx.font = '900 560px "Songti SC", STSong, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('毒', W*.53, H*.67);
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(25,25,25,.38)';
      ctx.lineWidth = 2;
      ctx.strokeRect(70, 70, 182, 54);
      ctx.fillStyle = '#574f45';
      ctx.font = '600 30px "Songti SC", STSong, serif';
      ctx.textBaseline = 'middle';
      ctx.fillText(`毒撰·${verdict.volume}`, 91, 98);
      ctx.fillStyle = '#756f66';
      ctx.font = '600 32px "Songti SC", STSong, serif';
      ctx.textAlign = 'right';
      ctx.fillText('太史公曰', W - 72, 104);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#191919';
      ctx.font = '700 58px "Songti SC", STSong, serif';
      ctx.textBaseline = 'top';
      const lines = wrapCanvasText(ctx, `「${verdict.sentence}」`, 780, 7);
      let y = 280;
      for(const line of lines){ ctx.fillText(line, 138, y); y += 82; }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = 'rgba(25,25,25,.14)';
      ctx.fillRect(112, 742, W - 224, 4);
      ctx.fillStyle = '#8a7b68';
      ctx.font = '500 24px "Songti SC", STSong, serif';
      const ev = wrapCanvasText(ctx, verdict.evidence, 800, 2);
      let ey = 776;
      for(const line of ev){ ctx.fillText(line, 140, ey); ey += 36; }
      ctx.restore();

      ctx.save();
      ctx.fillStyle = '#191919';
      ctx.font = '700 34px "Songti SC", STSong, serif';
      ctx.fillText(verdict.title, 135, 922);
      ctx.fillStyle = 'rgba(25,25,25,.56)';
      ctx.font = '500 26px "Songti SC", STSong, serif';
      ctx.fillText('司马迁.skill · 太史判词', 135, 966);
      ctx.font = '500 25px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.textAlign = 'right';
      ctx.fillText('simaqian.caojuege.com', W - 72, 1020);
      ctx.restore();

      drawSeal(ctx, W - 220, 852, 112);
    }

    async function renderSource(){
      if(!window.LieZhuanCard) return;
      await window.LieZhuanCard.renderToCanvas(sourceData, {canvas: els.sourceCard, ratio: 2});
    }

    async function renderWild(s){
      if(!window.LieZhuanCard) return;
      await window.LieZhuanCard.renderToCanvas(buildWildCardData(s), {canvas: els.wildCard, ratio: 2});
    }

    async function renderAll(){
      const s = readState();
      drawVerdictCard(s);
      await renderWild(s);
      writeHash(s);
    }

    function writeHash(s){
      const params = new URLSearchParams();
      params.set('name', s.name); params.set('bad1', s.bad1); params.set('bad2', s.bad2); params.set('bad3', s.bad3);
      const next = `${location.pathname}${location.search}#verdict?${params.toString()}`;
      history.replaceState(null, '', next);
    }

    function applyParams(){
      const p = getInitialParams();
      if(p.get('name')) els.name.value = p.get('name');
      if(p.get('bad1')) els.bad1.value = p.get('bad1');
      if(p.get('bad2')) els.bad2.value = p.get('bad2');
      if(p.get('bad3')) els.bad3.value = p.get('bad3');
    }

    async function downloadCanvas(canvas, filename){
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.96));
      if(!blob) return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    async function copyText(text){
      try{
        await navigator.clipboard.writeText(text);
      }catch(_){
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      els.toast.classList.add('show');
      setTimeout(()=>els.toast.classList.remove('show'), 1200);
    }

    els.form.addEventListener('submit', (e)=>{ e.preventDefault(); renderAll(); });
    [els.name, els.bad1, els.bad2, els.bad3].forEach(el => el.addEventListener('input', () => renderAll()));
    els.copyLinkBtn.addEventListener('click', () => copyText(location.href));
    els.downloadVerdictBtn.addEventListener('click', () => downloadCanvas(els.verdictCard, 'taishi-verdict.png'));
    els.downloadWildBtn.addEventListener('click', () => downloadCanvas(els.wildCard, 'wild-history-card.png'));

    applyParams();
    renderSource().then(renderAll);
  })();
  </script>
</body>
</html>
